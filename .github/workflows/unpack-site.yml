name: unpack-site-v4.11
on:
  push:
    branches: [main4.11]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main4.11
        uses: actions/checkout@v4
        with:
          ref: main4.11
          fetch-depth: 0
      - name: Download update zip
        run: curl -L --fail -o /tmp/site.zip "https://github.com/pavnxet/pavnxet.github.io/releases/download/v4.11/pavnxet-blog-v4.11.zip"
      - name: Unpack into repository
        run: unzip -o /tmp/site.zip -d .
      - name: Commit and push
        run: |
          git config user.name "pavnxet"
          git config user.email "pavnxet@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: v4.11 - add 7 project blog posts [skip ci]"
            git push origin main4.11
          fi
