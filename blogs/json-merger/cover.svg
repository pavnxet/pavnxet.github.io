<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
      .mono-text { font-family: Consolas, 'Courier New', monospace; }
    </style>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Cream Background -->
  <rect width="800" height="500" fill="#f4ede2"/>

  <!-- Subtle geometric background overlay -->
  <path d="M480 0 L800 0 L800 500 L320 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>

    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <!-- Merge Illustration -->
  <g id="merge-scene" transform="translate(0, -10)">
    <rect x="160" y="80" width="480" height="190" rx="16" fill="#fffdf9" filter="url(#elementShadow)"/>

    <!-- Browser Mockup Header -->
    <circle cx="190" cy="105" r="4" fill="#e8d5b7"/>
    <circle cx="202" cy="105" r="4" fill="#e8d5b7"/>
    <circle cx="214" cy="105" r="4" fill="#e8d5b7"/>
    <line x1="240" y1="105" x2="610" y2="105" stroke="#faf6f0" stroke-width="8" stroke-linecap="round"/>

    <!-- Three scattered quiz files -->
    <g>
      <rect x="210" y="130" width="56" height="72" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1.5"/>
      <text x="238" y="160" class="mono-text" font-size="14" fill="#b07d4a" text-anchor="middle">{ }</text>
      <line x1="222" y1="172" x2="254" y2="172" stroke="#c9a87c" stroke-width="2" stroke-linecap="round"/>
      <line x1="222" y1="180" x2="246" y2="180" stroke="#c9a87c" stroke-width="2" stroke-linecap="round"/>

      <rect x="278" y="130" width="56" height="72" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1.5"/>
      <text x="306" y="160" class="mono-text" font-size="14" fill="#b07d4a" text-anchor="middle">{ }</text>
      <line x1="290" y1="172" x2="322" y2="172" stroke="#c9a87c" stroke-width="2" stroke-linecap="round"/>
      <line x1="290" y1="180" x2="314" y2="180" stroke="#c9a87c" stroke-width="2" stroke-linecap="round"/>

      <rect x="346" y="130" width="56" height="72" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1.5"/>
      <text x="374" y="160" class="mono-text" font-size="14" fill="#b07d4a" text-anchor="middle">{ }</text>
      <line x1="358" y1="172" x2="390" y2="172" stroke="#c9a87c" stroke-width="2" stroke-linecap="round"/>
      <line x1="358" y1="180" x2="382" y2="180" stroke="#c9a87c" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Converging arrows -->
    <g stroke="#b07d4a" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M410 150 L448 160"/>
      <path d="M410 190 L448 180"/>
      <path d="M448 160 L440 160 M448 160 L446 152 M448 180 L440 180 M448 180 L446 188"/>
    </g>

    <!-- One master file -->
    <g>
      <rect x="452" y="128" width="76" height="88" rx="10" fill="#1e1a15"/>
      <text x="490" y="162" class="mono-text" font-size="16" fill="#f4ede2" text-anchor="middle">{ }</text>
      <line x1="466" y1="176" x2="514" y2="176" stroke="#b07d4a" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="466" y1="186" x2="504" y2="186" stroke="#b07d4a" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="466" y1="196" x2="496" y2="196" stroke="#b07d4a" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Merged check badge -->
    <g transform="translate(540, 200)">
      <circle r="16" fill="#b07d4a"/>
      <path d="M-7 0 L-2 5 L8 -6" stroke="#fffdf9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Status bar -->
    <g transform="translate(210, 232)">
      <rect width="200" height="22" rx="11" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <text x="100" y="15" class="sans-text" font-size="9" font-weight="600" fill="#4a4038" text-anchor="middle" letter-spacing="1">3 FILES → 1 MASTER FILE</text>
    </g>
  </g>

  <!-- Typography Text -->
  <g id="lower-segment">
    <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
      Quiz JSON <tspan class="title-italic">Merger</tspan>
    </text>

    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.2">
      Ten scattered quiz files in. One clean master file out.
    </text>

    <circle cx="400" cy="435" r="2" fill="#b07d4a"/>
    <line x1="360" y1="435" x2="385" y2="435" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="435" x2="440" y2="435" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
