<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>

  <path d="M480 0 L800 0 L800 500 L320 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    
    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <g id="upper-segment" transform="translate(0, 0)">
    <rect x="240" y="80" width="320" height="180" rx="12" fill="#fffdf9" filter="url(#elementShadow)"/>
    
    <circle cx="265" cy="102" r="3" fill="#e8d5b7"/>
    <circle cx="275" cy="102" r="3" fill="#e8d5b7"/>
    <circle cx="285" cy="102" r="3" fill="#e8d5b7"/>
    <line x1="310" y1="102" x2="535" y2="102" stroke="#faf6f0" stroke-width="6" stroke-linecap="round"/>

    <g transform="translate(240, 80)" opacity="0.85">
      <path d="M40 65 L40 135 M40 85 L60 85 M40 110 L60 110 M40 135 L60 135" stroke="#c9a87c" stroke-width="1.5" stroke-linecap="round"/>
      
      <rect x="70" y="78" width="130" height="12" rx="4" fill="#1e1a15"/>
      <rect x="70" y="104" width="170" height="12" rx="4" fill="#ecdfd0"/>
      <rect x="70" y="129" width="110" height="12" rx="4" fill="#b07d4a" opacity="0.3"/>
      
      <line x1="220" y1="84" x2="250" y2="84" stroke="#c9a87c" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="220" y1="135" x2="260" y2="135" stroke="#1e1a15" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <circle cx="400" cy="80" r="38" fill="#fffdf9" filter="url(#elementShadow)" stroke="#faf6f0" stroke-width="1"/>
    
    <circle cx="414" cy="74" r="14" fill="#b07d4a" opacity="0.12"/>
    
    <path d="M400 56 L400 106" stroke="#1e1a15" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M400 62 L382 78 M400 72 L376 90 M400 82 L372 100" stroke="#1e1a15" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M400 62 L418 78 M400 72 L424 90 M400 82 L428 100" stroke="#b07d4a" stroke-width="2.5" stroke-linecap="round"/>

    <g transform="translate(515, 175)" filter="url(#elementShadow)">
      <rect width="85" height="42" rx="6" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <text x="42.5" y="25" class="sans-text" font-size="9" font-weight="600" fill="#b07d4a" text-anchor="middle" letter-spacing="1.5">AI-READY</text>
    </g>
  </g>

  <g id="lower-segment">
    <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
      Tree<tspan class="title-italic">Bundle</tspan>
    </text>
    
    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.2">
      An elegant, client-side codebase ingester and AI project bundler.
    </text>
    
    <circle cx="400" cy="435" r="2" fill="#b07d4a"/>
    <line x1="360" y1="435" x2="385" y2="435" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="435" x2="440" y2="435" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
