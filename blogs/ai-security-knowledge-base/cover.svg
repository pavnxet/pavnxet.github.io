<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600;700&amp;display=swap');
      .t { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .ti { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .s { font-family: 'Sora', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>
  <path d="M480 0 L800 0 L800 500 L340 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <g transform="translate(0,-8)">
    <!-- shield -->
    <g transform="translate(196,74)">
      <rect width="150" height="200" rx="16" fill="#fffdf9" filter="url(#sh)"/>
      <path d="M75 34 L108 48 L108 96 C108 122, 90 138, 75 148 C60 138, 42 122, 42 96 L42 48 Z" fill="#faf6f0" stroke="#b07d4a" stroke-width="2.4"/>
      <path d="M62 92 L72 102 L90 78" fill="none" stroke="#1e1a15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="176" class="s" font-size="10" font-weight="600" fill="#4a4038" text-anchor="middle">2,052 checks</text>
      <text x="75" y="190" class="s" font-size="8.5" fill="#8c7e6e" text-anchor="middle">67 sources</text>
    </g>

    <!-- check cards -->
    <g transform="translate(360,74)">
      <rect width="272" height="62" rx="12" fill="#fffdf9" stroke="#ecdfd0" filter="url(#sh)"/>
      <rect x="16" y="16" width="60" height="16" rx="8" fill="#f6ded2"/>
      <text x="46" y="28" class="s" font-size="8.5" font-weight="600" fill="#b04a2e" text-anchor="middle">CRITICAL</text>
      <text x="16" y="48" class="mono" font-size="10" fill="#4a4038">SKB-ASVS-V1-2-4</text>
      <text x="256" y="30" class="s" font-size="9" fill="#8c7e6e" text-anchor="end">SQL injection</text>

      <g transform="translate(0,72)">
        <rect width="272" height="62" rx="12" fill="#fffdf9" stroke="#ecdfd0" filter="url(#sh)"/>
        <rect x="16" y="16" width="46" height="16" rx="8" fill="#f4e6cf"/>
        <text x="39" y="28" class="s" font-size="8.5" font-weight="600" fill="#8e6a2e" text-anchor="middle">HIGH</text>
        <text x="16" y="48" class="mono" font-size="10" fill="#4a4038">SKB-WSTG-INFO-01</text>
        <text x="256" y="30" class="s" font-size="9" fill="#8c7e6e" text-anchor="end">Auth checks</text>
      </g>
    </g>
  </g>

  <g>
    <text x="400" y="362" class="t" font-size="28" text-anchor="middle">AI Security KB — <tspan class="ti">2,052 OWASP check cards</tspan></text>
    <text x="400" y="396" class="s" font-size="13.5" font-weight="300" fill="#4a4038" text-anchor="middle">Give an AI coding agent a codebase — it returns the exact security checks that matter.</text>
    <circle cx="400" cy="433" r="2" fill="#b07d4a"/>
    <line x1="352" y1="433" x2="385" y2="433" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="433" x2="448" y2="433" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
