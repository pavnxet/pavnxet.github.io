<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#a07846" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>
  
  <path d="M 460 0 L 800 0 L 800 500 L 310 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <g stroke="#e8d5b7" stroke-dasharray="4 4" stroke-width="0.75" opacity="0.8">
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="320" x2="800" y2="320" />
  </g>

  <circle cx="220" cy="160" r="90" fill="none" stroke="#c9a87c" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.4"/>
  <circle cx="580" cy="130" r="60" fill="none" stroke="#c9a87c" stroke-width="0.5" opacity="0.3"/>
  <line x1="250" y1="270" x2="550" y2="270" stroke="#e8d5b7" stroke-width="1" opacity="0.5" />

  <g id="vector-illustration">
    <rect x="250" y="65" width="300" height="185" rx="16" fill="#fffdf9" filter="url(#elementShadow)"/>
    
    <rect x="280" y="92" width="240" height="28" rx="14" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
    <g transform="translate(294, 100)">
      <circle cx="6" cy="6" r="4" fill="none" stroke="#b07d4a" stroke-width="1.5"/>
      <line x1="9" y1="9" x2="13" y2="13" stroke="#b07d4a" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="22" y="4" width="65" height="4" rx="2" fill="#1e1a15" opacity="0.15"/>
    </g>
    
    <g transform="translate(280, 142)">
      <rect x="0" y="0" width="120" height="6" rx="3" fill="#1e1a15" opacity="0.15"/>
      <rect x="130" y="0" width="45" height="6" rx="3" fill="#c9a87c" opacity="0.5"/>
      <circle cx="215" cy="3" r="3.5" fill="#b07d4a" opacity="0.8"/>
      
      <rect x="0" y="18" width="140" height="6" rx="3" fill="#1e1a15" opacity="0.15"/>
      <rect x="150" y="18" width="30" height="6" rx="3" fill="#c9a87c" opacity="0.5"/>
      <circle cx="215" cy="21" r="3.5" fill="#1e1a15" opacity="0.2"/>

      <rect x="0" y="36" width="95" height="6" rx="3" fill="#1e1a15" opacity="0.15"/>
      <rect x="105" y="36" width="65" height="6" rx="3" fill="#c9a87c" opacity="0.5"/>
      <circle cx="215" cy="39" r="3.5" fill="#b07d4a" opacity="0.8"/>

      <rect x="0" y="54" width="110" height="6" rx="3" fill="#1e1a15" opacity="0.15"/>
      <rect x="120" y="54" width="40" height="6" rx="3" fill="#c9a87c" opacity="0.5"/>
      <circle cx="215" cy="57" r="3.5" fill="#1e1a15" opacity="0.2"/>
    </g>

    <g filter="url(#elementShadow)">
      <circle cx="540" cy="80" r="32" fill="#fffdf9"/>
      <circle cx="540" cy="80" r="24" fill="#b07d4a"/>
      <path d="M 529 88 L 529 78 M 540 88 L 540 70 M 551 88 L 551 75" stroke="#fffdf9" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <path d="M 232 195 L 244 183 L 244 207 Z" fill="#b07d4a" opacity="0.3"/>
  </g>

  <g id="card-metadata">
    <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
      3rd-Grade Result <tspan class="title-italic">Analytics</tspan>
    </text>
    
    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.2">
      High-Performance Serverless Client-Side Search Engine
    </text>
  </g>
</svg>
