<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500&amp;display=swap');
      
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
      
      .grid-line { stroke: #e8d5b7; stroke-width: 1; stroke-dasharray: 4 6; opacity: 0.6; }
      .accent-bg { fill: none; stroke: #ecdfd0; stroke-width: 2; opacity: 0.6; }
      
      .card-base { fill: #fffdf9; stroke: #e8d5b7; stroke-width: 1.5; }
      .card-accent { stroke: #b07d4a; stroke-width: 1.5; fill: none; }
      .card-ui { fill: #e8d5b7; opacity: 0.4; }
      .vector-line { stroke: #1e1a15; stroke-width: 1.5; fill: none; }
      .vector-dash { stroke: #c9a87c; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    </style>
    
    <filter id="elementShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>

  <g>
    <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="320" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
    
    <line x1="0" y1="80" x2="800" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="800" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="800" y2="240" class="grid-line" />
  </g>

  <circle cx="800" cy="160" r="180" class="accent-bg" />
  <circle cx="800" cy="160" r="140" class="accent-bg" stroke-dasharray="6 4" />

  <g transform="translate(0, -10)">
    <g filter="url(#elementShadow)" transform="translate(240, 110)">
      <rect width="320" height="180" rx="6" class="card-base" />
      <path d="M 0,45 L 320,45 M 0,135 L 320,135" class="grid-line" />
      <rect x="40" y="22" width="240" height="135" rx="3" class="card-accent" opacity="0.4" stroke-dasharray="4 4" />
      <circle cx="15" cy="15" r="4" class="card-ui" />
      <circle cx="30" cy="15" r="4" class="card-ui" />
      <circle cx="45" cy="15" r="4" class="card-ui" />
    </g>

    <g filter="url(#elementShadow)" transform="translate(290, 75)">
      <rect width="220" height="215" rx="6" class="card-base" />
      <rect x="20" y="30" width="180" height="155" rx="2" class="vector-dash" />
      <circle cx="20" cy="30" r="3" fill="#c9a87c" />
      <circle cx="200" cy="185" r="3" fill="#c9a87c" />
      <line x1="110" y1="0" x2="110" y2="215" class="grid-line" />
    </g>

    <g filter="url(#elementShadow)" transform="translate(330, 95)">
      <rect width="140" height="140" rx="8" fill="#fffdf9" stroke="#1e1a15" stroke-width="2" />
      
      <line x1="20" y1="20" x2="40" y2="20" class="vector-line" />
      <line x1="20" y1="20" x2="20" y2="40" class="vector-line" />
      
      <line x1="120" y1="20" x2="100" y2="20" class="vector-line" />
      <line x1="120" y1="20" x2="120" y2="40" class="vector-line" />
      
      <line x1="20" y1="120" x2="40" y2="120" class="vector-line" />
      <line x1="20" y1="120" x2="20" y2="100" class="vector-line" />
      
      <line x1="120" y1="120" x2="100" y2="120" class="vector-line" />
      <line x1="120" y1="120" x2="120" y2="100" class="vector-line" />
      
      <rect x="30" y="30" width="80" height="80" rx="4" fill="none" stroke="#b07d4a" stroke-width="1.5" />
      
      <circle cx="70" cy="70" r="6" fill="none" stroke="#b07d4a" stroke-width="1" />
      <line x1="70" y1="58" x2="70" y2="82" stroke="#b07d4a" stroke-width="1" />
      <line x1="58" y1="70" x2="82" y2="70" stroke="#b07d4a" stroke-width="1" />
    </g>
  </g>

  <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
    insta<tspan class="sans-text" font-weight="500" fill="#b07d4a">fit.io</tspan>
  </text>
  
  <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle">
    An ultra-minimalist client-side utility engine for image aspect ratio normalization.
  </text>
</svg>
