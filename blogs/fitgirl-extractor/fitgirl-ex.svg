<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="FitGirl Repacks Archive Scanner">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Sora:wght@300;400;500&display=swap');

      .title-text {
        font-family: 'Lora', Georgia, serif;
        font-weight: 500;
        fill: #1e1a15;
      }

      .title-italic {
        font-family: 'Lora', Georgia, serif;
        font-style: italic;
        fill: #b07d4a;
      }

      .sans-text {
        font-family: 'Sora', system-ui, sans-serif;
      }
    </style>

    <filter id="elementShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#a07846" flood-opacity="0.06"/>
    </filter>

    <linearGradient id="scanGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8d5b7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b07d4a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8d5b7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f4ede2"/>

  <!-- Editorial Accent Shape -->
  <path d="M560 0C680 40 760 130 800 240V500H640C560 420 610 320 550 220C505 145 495 65 560 0Z"
        fill="#ecdfd0"
        opacity="0.6"/>

  <!-- Technical Grid -->
  <g stroke="#e8d5b7" stroke-width="1" stroke-dasharray="3 9" opacity="0.5">
    <line x1="80" y1="90" x2="720" y2="90"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="180" y1="40" x2="180" y2="300"/>
    <line x1="400" y1="40" x2="400" y2="300"/>
    <line x1="620" y1="40" x2="620" y2="300"/>
  </g>

  <!-- Main Illustration -->
  <g transform="translate(400 165)">

    <!-- Archive Stack -->
    <g filter="url(#elementShadow)">
      <rect x="-120" y="-20" width="220" height="130" rx="18" fill="#faf6f0"/>
      <rect x="-105" y="-35" width="220" height="130" rx="18" fill="#fffdf9"/>
      <rect x="-90" y="-50" width="220" height="130" rx="18" fill="#fffdf9"/>
    </g>

    <!-- Scan Beam -->
    <rect x="-60" y="-8" width="160" height="14" rx="7" fill="url(#scanGlow)"/>

    <!-- Archive Rows -->
    <g fill="#ecdfd0">
      <rect x="-55" y="-22" width="120" height="8" rx="4"/>
      <rect x="-55" y="2" width="160" height="8" rx="4"/>
      <rect x="-55" y="26" width="135" height="8" rx="4"/>
      <rect x="-55" y="50" width="180" height="8" rx="4"/>
    </g>

    <!-- Data Dots -->
    <g fill="#b07d4a">
      <circle cx="145" cy="-10" r="4"/>
      <circle cx="165" cy="10" r="4"/>
      <circle cx="145" cy="30" r="4"/>
      <circle cx="165" cy="50" r="4"/>
    </g>

    <!-- Magnifying Glass -->
    <g filter="url(#elementShadow)">
      <circle cx="-135" cy="-55" r="48" fill="#fffdf9"/>
      <circle cx="-135" cy="-55" r="25" fill="none" stroke="#1e1a15" stroke-width="4"/>
      <line x1="-118" y1="-38" x2="-95" y2="-15"
            stroke="#1e1a15"
            stroke-width="5"
            stroke-linecap="round"/>

      <!-- Tiny Nodes Inside Lens -->
      <circle cx="-145" cy="-63" r="3" fill="#b07d4a"/>
      <circle cx="-128" cy="-57" r="3" fill="#b07d4a"/>
      <circle cx="-141" cy="-45" r="3" fill="#b07d4a"/>

      <line x1="-145" y1="-63" x2="-128" y2="-57"
            stroke="#c9a87c"
            stroke-width="1.5"/>
      <line x1="-128" y1="-57" x2="-141" y2="-45"
            stroke="#c9a87c"
            stroke-width="1.5"/>
    </g>

    <!-- Decorative Orbit -->
    <circle cx="0" cy="15" r="150"
            fill="none"
            stroke="#e8d5b7"
            stroke-width="1.2"/>

    <circle cx="0" cy="15" r="130"
            fill="none"
            stroke="#c9a87c"
            stroke-width="1"
            opacity="0.35"/>

  </g>

  <!-- Title -->
  <text x="400"
        y="365"
        class="title-text"
        font-size="30"
        text-anchor="middle">
    FitGirl Repacks
    <tspan class="title-italic"> Archive Scanner</tspan>
  </text>

  <!-- Subtitle -->
  <text x="400"
        y="398"
        class="sans-text"
        font-size="14"
        font-weight="300"
        fill="#4a4038"
        text-anchor="middle">
    Concurrent scraping, metadata extraction, search refinement and export workflows.
  </text>

  <!-- Bottom Editorial Rule -->
  <line x1="300"
        y1="430"
        x2="500"
        y2="430"
        stroke="#c9a87c"
        stroke-width="1.5"
        stroke-linecap="round"/>
</svg>