<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>
  
  <g transform="translate(400, 200)" text-anchor="middle">
    <path d="M-40,-20 L40,-20 A20,20 0 0,1 60,0 L40,40 A10,10 0 0,1 30,50 L10,30 L-10,30 L-30,50 A10,10 0 0,1 -40,40 L-60,0 A20,20 0 0,1 -40,-20 Z" fill="none" stroke="#b07d4a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-20" cy="0" r="5" fill="#1e1a15"/>
    <circle cx="-20" cy="15" r="5" fill="#1e1a15"/>
    <circle cx="-30" cy="7.5" r="5" fill="#1e1a15"/>
    <circle cx="-10" cy="7.5" r="5" fill="#1e1a15"/>
    <circle cx="25" cy="2" r="4" fill="#b07d4a"/>
    <circle cx="37" cy="12" r="4" fill="#b07d4a"/>
  </g>

  <g id="lower-segment" text-anchor="middle">
    <text x="400" y="365" class="title-text" font-size="28">
      FitGirl Repacks<tspan class="title-italic"> Archive Scanner</tspan>
    </text>
    
    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" letter-spacing="0.2">
      Concurrent scraping, metadata extraction, search refinement and export workflows.
    </text>
    
    <circle cx="400" cy="435" r="2" fill="#b07d4a"/>
    <line x1="360" y1="435" x2="385" y2="435" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="435" x2="440" y2="435" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
