<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600;700&amp;display=swap');
      .t { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .ti { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .s { font-family: 'Sora', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>
  <path d="M470 0 L800 0 L800 500 L330 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <g transform="translate(0,-8)">
    <!-- video panel -->
    <g transform="translate(150,86)">
      <rect width="230" height="176" rx="16" fill="#fffdf9" filter="url(#sh)"/>
      <rect x="18" y="16" width="194" height="104" rx="10" fill="#1f1d1a"/>
      <circle cx="115" cy="68" r="18" fill="#b07d4a"/>
      <path d="M109 59 L126 68 L109 77 Z" fill="#fffdf9"/>
      <!-- timeline -->
      <rect x="18" y="132" width="194" height="6" rx="3" fill="#ecdfd0"/>
      <rect x="18" y="132" width="86" height="6" rx="3" fill="#b07d4a"/>
      <circle cx="104" cy="135" r="6" fill="#1e1a15"/>
      <g fill="#b07d4a">
        <circle cx="46" cy="135" r="3"/><circle cx="104" cy="135" r="3" fill="none"/>
        <circle cx="140" cy="135" r="3"/><circle cx="176" cy="135" r="3"/>
      </g>
      <text x="18" y="160" class="mono" font-size="8.5" fill="#8c7e6e">Q22 01:34:21  ·  Q23 01:38:45</text>
    </g>

    <!-- arrow -->
    <path d="M392 174 L424 174" stroke="#b07d4a" stroke-width="2"/>
    <path d="M424 174 L416 169 L416 179 Z" fill="#b07d4a"/>

    <!-- pdf stack -->
    <g transform="translate(438,86)">
      <rect x="10" y="10" width="150" height="176" rx="12" fill="#faf6f0" stroke="#e8d5b7"/>
      <rect x="0" y="0" width="150" height="176" rx="12" fill="#fffdf9" stroke="#e8d5b7" filter="url(#sh)"/>
      <rect x="0" y="0" width="150" height="28" rx="12" fill="#f4ede2"/>
      <text x="14" y="19" class="mono" font-size="9" font-weight="600" fill="#b07d4a">Q22-Q37.pdf</text>
      <rect x="14" y="42" width="122" height="60" rx="6" fill="#faf6f0" stroke="#ecdfd0"/>
      <text x="75" y="66" class="s" font-size="8.5" fill="#8c7e6e" text-anchor="middle">Question slide</text>
      <text x="75" y="82" class="s" font-size="8.5" fill="#8c7e6e" text-anchor="middle">no answers</text>
      <text x="14" y="122" class="s" font-size="9" fill="#4a4038">16 pages</text>
      <text x="136" y="122" class="s" font-size="9" fill="#8c7e6e" text-anchor="end">~25s</text>
      <rect x="14" y="136" width="122" height="6" rx="3" fill="#ecdfd0"/>
      <rect x="14" y="136" width="80" height="6" rx="3" fill="#b07d4a"/>
    </g>
  </g>

  <g>
    <text x="400" y="362" class="t" font-size="28" text-anchor="middle">yt-slidesnap — <tspan class="ti">lecture video to slide PDF</tspan></text>
    <text x="400" y="396" class="s" font-size="13.5" font-weight="300" fill="#4a4038" text-anchor="middle">Give a video and timestamps; get a clean PDF of the slides — no video download, no answers.</text>
    <circle cx="400" cy="433" r="2" fill="#b07d4a"/>
    <line x1="352" y1="433" x2="385" y2="433" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="433" x2="448" y2="433" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
