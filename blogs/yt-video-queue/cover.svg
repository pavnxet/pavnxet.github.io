<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600;700&amp;display=swap');
      .t { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .ti { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .s { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2"/>
  <path d="M470 0 L800 0 L800 500 L330 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <g transform="translate(0,-8)">
    <rect x="180" y="70" width="440" height="208" rx="16" fill="#fffdf9" filter="url(#sh)"/>

    <!-- header row -->
    <text x="204" y="100" class="s" font-size="12" font-weight="600" fill="#1e1a15">My Series · Physics</text>
    <g transform="translate(500,84)">
      <rect width="96" height="22" rx="11" fill="#faf6f0" stroke="#e8d5b7"/>
      <path d="M14 9 a4 4 0 1 1 4 4 l-1 0 -0.6 2 -2.2 0 -0.4 2 -2 0 0 -2 4.2 0" fill="none" stroke="#b07d4a" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="58" y="15" class="s" font-size="9" font-weight="600" fill="#4a4038" text-anchor="middle">Passkey</text>
    </g>

    <!-- rows -->
    <g transform="translate(204,116)">
      <rect width="392" height="42" rx="10" fill="#f4ede2" stroke="#e8d5b7"/>
      <rect x="10" y="8" width="46" height="26" rx="6" fill="#e8d5b7"/>
      <path d="M30 19 L38 25 L30 31 Z" fill="#b07d4a"/>
      <text x="68" y="19" class="s" font-size="10.5" font-weight="600" fill="#1e1a15">Lecture 01 — Kinematics</text>
      <text x="68" y="33" class="s" font-size="8.5" fill="#8c7e6e">youtube.com · 42:10</text>
      <text x="376" y="25" class="s" font-size="9" fill="#b07d4a" text-anchor="end">now</text>
    </g>
    <g transform="translate(204,164)">
      <rect width="392" height="42" rx="10" fill="#fffdf9" stroke="#ecdfd0"/>
      <rect x="10" y="8" width="46" height="26" rx="6" fill="#ecdfd0"/>
      <path d="M30 19 L38 25 L30 31 Z" fill="#b07d4a"/>
      <text x="68" y="19" class="s" font-size="10.5" font-weight="600" fill="#4a4038">Lecture 02 — Newton's Laws</text>
      <text x="68" y="33" class="s" font-size="8.5" fill="#8c7e6e">youtube.com · 38:55</text>
      <text x="376" y="25" class="s" font-size="9" fill="#8c7e6e" text-anchor="end">next</text>
    </g>
    <g transform="translate(204,212)">
      <rect width="392" height="42" rx="10" fill="#fffdf9" stroke="#ecdfd0"/>
      <rect x="10" y="8" width="46" height="26" rx="6" fill="#ecdfd0"/>
      <path d="M30 19 L38 25 L30 31 Z" fill="#b07d4a"/>
      <text x="68" y="19" class="s" font-size="10.5" font-weight="600" fill="#4a4038">t.me · Physics Channel post 128</text>
      <text x="68" y="33" class="s" font-size="8.5" fill="#8c7e6e">telegram · auto-titled</text>
      <text x="376" y="25" class="s" font-size="9" fill="#8c7e6e" text-anchor="end">queued</text>
    </g>
  </g>

  <g>
    <text x="400" y="362" class="t" font-size="28" text-anchor="middle">YT Video Queue — <tspan class="ti">passkey watch queue</tspan></text>
    <text x="400" y="396" class="s" font-size="13.5" font-weight="300" fill="#4a4038" text-anchor="middle">Order links into series, watch one by one, and pick up exactly where you left off.</text>
    <circle cx="400" cy="433" r="2" fill="#b07d4a"/>
    <line x1="352" y1="433" x2="385" y2="433" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="433" x2="448" y2="433" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
