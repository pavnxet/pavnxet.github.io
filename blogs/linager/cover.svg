<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600;700&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Cream Background -->
  <rect width="800" height="500" fill="#f4ede2"/>

  <!-- Subtle geometric background overlay -->
  <path d="M480 0 L800 0 L800 500 L320 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    
    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <!-- Dashboard & Passkey Illustration Panel -->
  <g id="linager-card" transform="translate(0, -10)">
    <!-- Container Panel -->
    <rect x="200" y="70" width="400" height="210" rx="16" fill="#fffdf9" filter="url(#elementShadow)"/>
    
    <!-- Browser Mockup Header -->
    <circle cx="230" cy="95" r="4" fill="#e8d5b7"/>
    <circle cx="242" cy="95" r="4" fill="#e8d5b7"/>
    <circle cx="254" cy="95" r="4" fill="#e8d5b7"/>
    <rect x="280" y="87" width="220" height="16" rx="8" fill="#faf6f0"/>
    <text x="390" y="99" class="sans-text" font-size="9" fill="#8c7e6e" text-anchor="middle">linager.pavneet1804.workers.dev</text>

    <!-- App Inner Mockup -->
    <!-- Brand badge -->
    <g transform="translate(230, 120)">
      <circle cx="16" cy="16" r="16" fill="#faf6f0"/>
      <!-- Chain Link Icon -->
      <path d="M11 18 L14 15 C16 13, 19 13, 21 15 C23 17, 23 20, 21 22 L18 25 C16 27, 13 27, 11 25" fill="none" stroke="#b07d4a" stroke-width="2" stroke-linecap="round"/>
      <path d="M21 14 L18 17 C16 19, 13 19, 11 17 C9 15, 9 12, 11 10 L14 7 C16 5, 19 5, 21 7" fill="none" stroke="#1e1a15" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="21" class="sans-text" font-size="14" font-weight="700" fill="#1e1a15">Linager</text>
      <rect x="100" y="10" width="46" height="16" rx="4" fill="#ecdfd0"/>
      <text x="123" y="22" class="sans-text" font-size="9" font-weight="600" fill="#b07d4a" text-anchor="middle">EDGE</text>
    </g>

    <!-- Passkey Biometric Chip -->
    <g transform="translate(470, 120)">
      <rect width="100" height="32" rx="16" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <text x="490" y="141" class="sans-text" font-size="13">🔑</text>
      <text x="508" y="140" class="sans-text" font-size="10" font-weight="600" fill="#4a4038">Passkey</text>
    </g>

    <!-- Sample Link Item -->
    <g transform="translate(230, 170)">
      <rect width="340" height="52" rx="10" fill="#faf6f0" stroke="#ecdfd0" stroke-width="1"/>
      <!-- Pin icon -->
      <circle cx="22" cy="26" r="12" fill="#fffdf9"/>
      <text x="22" y="30" class="sans-text" font-size="12" text-anchor="middle">📌</text>
      <!-- Title & URL -->
      <text x="44" y="22" class="sans-text" font-size="12" font-weight="600" fill="#1e1a15">YouTube Study Class</text>
      <text x="44" y="38" class="sans-text" font-size="9.5" fill="#8c7e6e">https://youtube.com/watch?v=5Mb6hvz...</text>
      <!-- Tag badge -->
      <rect x="270" y="18" width="55" height="18" rx="9" fill="#ecdfd0"/>
      <text x="297.5" y="30.5" class="sans-text" font-size="8.5" font-weight="500" fill="#4a4038" text-anchor="middle">#study</text>
    </g>

    <!-- Feature Pill Badges -->
    <g transform="translate(230, 240)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="#fffdf9" stroke="#e8d5b7" stroke-width="1"/>
      <text x="50" y="14" class="sans-text" font-size="9" font-weight="500" fill="#4a4038" text-anchor="middle">⚡ Zero Passwords</text>

      <rect x="110" y="0" width="110" height="22" rx="11" fill="#fffdf9" stroke="#e8d5b7" stroke-width="1"/>
      <text x="165" y="14" class="sans-text" font-size="9" font-weight="500" fill="#4a4038" text-anchor="middle">☁️ Cloudflare Edge</text>

      <rect x="230" y="0" width="110" height="22" rx="11" fill="#fffdf9" stroke="#e8d5b7" stroke-width="1"/>
      <text x="285" y="14" class="sans-text" font-size="9" font-weight="500" fill="#b07d4a" text-anchor="middle">🗄️ Turso libSQL</text>
    </g>
  </g>

  <!-- Typography Text -->
  <g id="lower-segment">
    <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
      Linager — <tspan class="title-italic">Passwordless Link Hub</tspan>
    </text>
    
    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.2">
      Save, pin, tag, and open your links from any device with effortless Passkey authentication.
    </text>
    
    <circle cx="400" cy="435" r="2" fill="#b07d4a"/>
    <line x1="360" y1="435" x2="385" y2="435" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="435" x2="440" y2="435" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
