<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;600&amp;display=swap');
      
      .title-text { 
        font-family: 'Lora', Georgia, serif; 
        font-weight: 500; 
        fill: #1e1a15; 
      }
      .title-italic { 
        font-family: 'Lora', Georgia, serif; 
        font-style: italic; 
        fill: #b07d4a; 
      }
      .sans-text { 
        font-family: 'Sora', system-ui, sans-serif; 
      }
    </style>
    
    <filter id="elementShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a07846" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2" />

  <circle cx="720" cy="120" r="220" stroke="#ecdfd0" stroke-width="1.5" fill="none" opacity="0.6" />
  <circle cx="720" cy="120" r="180" stroke="#ecdfd0" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.4" />

  <g stroke="#e8d5b7" stroke-width="0.75" stroke-dasharray="8 8" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="120" x2="800" y2="120" />
  </g>

  <text x="95" y="45" class="sans-text" font-size="10" fill="#c9a87c" letter-spacing="1.5">SYS.LOC // 0xAA-DL</text>
  <text x="645" y="45" class="sans-text" font-size="10" fill="#c9a87c" letter-spacing="1.5" text-anchor="end">v1.2.0 // STABLE</text>

  <g transform="translate(0, -10)">
    <rect x="250" y="80" width="220" height="140" rx="12" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1" filter="url(#elementShadow)" opacity="0.7" transform="rotate(-4 360 150)" />
    <line x1="275" y1="110" x2="335" y2="110" stroke="#e8d5b7" stroke-width="2" transform="rotate(-4 360 150)" />
    <line x1="275" y1="125" x2="415" y2="125" stroke="#e8d5b7" stroke-width="1" transform="rotate(-4 360 150)" />
    <line x1="275" y1="140" x2="385" y2="140" stroke="#e8d5b7" stroke-width="1" transform="rotate(-4 360 150)" />

    <rect x="310" y="95" width="240" height="150" rx="16" fill="#fffdf9" stroke="#c9a87c" stroke-width="1" filter="url(#elementShadow)" />
    
    <rect x="335" y="120" width="35" height="35" rx="8" fill="#f4ede2" />
    
    <g transform="translate(342, 127)" stroke="#1e1a15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 2 17 C 5 14, 10 14, 10 17 C 10 14, 15 14, 18 17 M 2 5 L 2 17 M 10 5 L 10 17 M 18 5 L 18 17 C 15 2, 11 2, 10 5 C 9 2, 5 2, 2 5" />
      <path d="M 10 2 L 10 10 M 8 8 L 10 10 L 12 8" stroke="#b07d4a" stroke-width="1.75" />
    </g>

    <rect x="385" y="123" width="115" height="10" rx="3" fill="#e8d5b7" opacity="0.5" />
    <rect x="385" y="141" width="75" height="7" rx="2" fill="#e8d5b7" opacity="0.3" />
    
    <g transform="translate(335, 180)">
      <rect x="0" y="0" width="45" height="18" rx="9" fill="#f4ede2" stroke="#c9a87c" stroke-width="1" />
      <text x="22.5" y="12" class="sans-text" font-size="8" font-weight="600" fill="#b07d4a" text-anchor="middle">.GL</text>

      <rect x="52" y="0" width="45" height="18" rx="9" fill="#f4ede2" stroke="#c9a87c" stroke-width="1" />
      <text x="74.5" y="12" class="sans-text" font-size="8" font-weight="600" fill="#b07d4a" text-anchor="middle">.LI</text>

      <rect x="104" y="0" width="45" height="18" rx="9" fill="#f4ede2" stroke="#c9a87c" stroke-width="1" />
      <text x="126.5" y="12" class="sans-text" font-size="8" font-weight="600" fill="#b07d4a" text-anchor="middle">.SE</text>

      <circle cx="164" cy="9" r="4" fill="#b07d4a" />
      <circle cx="176" cy="9" r="4" fill="#c9a87c" opacity="0.6" />
    </g>

    <path d="M 570 95 L 580 95 M 570 245 L 580 245 M 575 95 L 575 245" stroke="#c9a87c" stroke-width="1" />
    <text x="585" y="175" class="sans-text" font-size="9" fill="#c9a87c">150 px</text>
  </g>

  <g>
    <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
      Anna's Archive <tspan class="title-italic">Downloader</tspan>
    </text>

    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.2">
      Multi-mirror search engine &amp; direct download tool with local MCP capabilities.
    </text>

    <line x1="360" y1="430" x2="440" y2="430" stroke="#b07d4a" stroke-width="1.5" />
    <text x="400" y="455" class="sans-text" font-size="9" font-weight="600" fill="#b07d4a" letter-spacing="3" text-anchor="middle">NO API KEY REQUIRED</text>
  </g>
</svg>
