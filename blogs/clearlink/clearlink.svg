<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Sora:wght@300;400;500;600&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
    </style>

    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#a07846" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="#f4ede2" />

  <path d="M 450 0 L 800 0 L 800 500 L 320 500 Z" fill="#ecdfd0" opacity="0.6" />

  <g stroke="#e8d5b7" stroke-width="1" opacity="0.7">
    <line x1="120" y1="60" x2="120" y2="380" stroke-dasharray="2 4" />
    <line x1="680" y1="60" x2="680" y2="380" stroke-dasharray="2 4" />
    <path d="M 40 50 L 60 50 M 50 40 L 50 60" />
    <path d="M 760 450 L 740 450 M 750 440 L 750 460" />
  </g>

  <g transform="translate(400, 200)">
    
    <circle cx="0" cy="0" r="130" fill="#b07d4a" opacity="0.08" />
    <circle cx="-20" cy="10" r="95" fill="none" stroke="#e8d5b7" stroke-width="1.5" />
    
    <g transform="translate(-110, -130)" filter="url(#elementShadow)">
      <rect width="180" height="230" rx="10" fill="#fffdf9" stroke="#ecdfd0" stroke-width="1" />
      
      <g fill="#ecdfd0" transform="translate(24, 36)">
        <rect width="45" height="4" rx="2" fill="#c9a87c" />
        <rect y="16" width="132" height="3" rx="1.5" />
        <rect y="28" width="110" height="3" rx="1.5" />
        <rect y="40" width="124" height="3" rx="1.5" />
        
        <g transform="translate(0, 60)">
          <rect width="40" height="4" rx="2" fill="#b07d4a" />
          <line x1="48" y1="2" x2="120" y2="2" stroke="#8c7e6e" stroke-width="2" stroke-dasharray="2 3" opacity="0.5" />
          <path d="M 60 -1 L 64 5 M 64 -1 L 60 5" stroke="#b07d4a" stroke-width="1.2" />
          <path d="M 90 -1 L 94 5 M 94 -1 L 90 5" stroke="#b07d4a" stroke-width="1.2" />
        </g>
        
        <rect y="84" width="132" height="3" rx="1.5" />
        <rect y="96" width="120" height="3" rx="1.5" />
        <rect y="108" width="85" height="3" rx="1.5" />
      </g>
      
      <circle cx="156" cy="20" r="3" fill="#c9a87c" />
    </g>

    <g transform="translate(50, 30)" filter="url(#elementShadow)">
      <circle cx="0" cy="0" r="50" fill="#fffdf9" stroke="#e8d5b7" stroke-width="1" />
      <circle cx="0" cy="0" r="42" fill="#faf6f0" />
      
      <g fill="none" stroke="#1e1a15" stroke-width="3.5" stroke-linecap="round" transform="rotate(-45) translate(-4, 0)">
        <rect x="-18" y="-8" width="22" height="16" rx="8" stroke="#b07d4a" stroke-width="4" />
        <rect x="-2" y="-8" width="22" height="16" rx="8" stroke="#1e1a15" />
        <line x1="-2" y1="0" x2="4" y2="0" stroke="#faf6f0" stroke-width="6" />
        <line x1="-2" y1="0" x2="4" y2="0" stroke="#1e1a15" stroke-width="4" />
      </g>
    </g>

    <path d="M 120 -60 L 123 -48 L 135 -45 L 123 -42 L 120 -30 L 117 -42 L 105 -45 L 117 -48 Z" fill="#c9a87c" opacity="0.8" />
    <circle cx="-140" cy="80" r="4" fill="#8c7e6e" opacity="0.6" />
    <circle cx="160" cy="90" r="3" fill="#b07d4a" opacity="0.4" />

    <text x="0" y="165" class="title-text" font-size="28" text-anchor="middle" letter-spacing="-0.01em">
      ClearLink—<tspan class="title-italic">PDF</tspan>
    </text>

    <text x="0" y="198" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.01em">
      Purge tracking tokens and sanitize document URLs safely.
    </text>
  </g>
</svg>
