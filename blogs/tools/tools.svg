<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&amp;family=Sora:wght@300;400;500;600&amp;display=swap');
      .title-text { font-family: 'Lora', Georgia, serif; font-weight: 500; fill: #1e1a15; }
      .title-italic { font-family: 'Lora', Georgia, serif; font-style: italic; fill: #b07d4a; }
      .sans-text { font-family: 'Sora', system-ui, sans-serif; }
    </style>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a07846" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Cream Background -->
  <rect width="800" height="500" fill="#f4ede2"/>

  <!-- Subtle geometric background overlay -->
  <path d="M480 0 L800 0 L800 500 L320 500 Z" fill="#ecdfd0" opacity="0.6"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.8">
    <line x1="60" y1="50" x2="740" y2="50" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="60" y1="320" x2="740" y2="320" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="100" y1="30" x2="100" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="700" y1="30" x2="700" y2="470" stroke="#e8d5b7" stroke-width="1" stroke-dasharray="4 8"/>
    
    <circle cx="100" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="50" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="100" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
    <circle cx="700" cy="320" r="3" fill="none" stroke="#c9a87c" stroke-width="1"/>
  </g>

  <!-- Dashboard Representation with Tool Icons -->
  <g id="tools-dashboard" transform="translate(0, -10)">
    <!-- Container Panel -->
    <rect x="220" y="80" width="360" height="190" rx="16" fill="#fffdf9" filter="url(#elementShadow)"/>
    
    <!-- Browser Mockup Header -->
    <circle cx="250" cy="105" r="4" fill="#e8d5b7"/>
    <circle cx="262" cy="105" r="4" fill="#e8d5b7"/>
    <circle cx="274" cy="105" r="4" fill="#e8d5b7"/>
    <line x1="300" y1="105" x2="550" y2="105" stroke="#faf6f0" stroke-width="8" stroke-linecap="round"/>

    <!-- Grid of 6 small dashboard items (the 6 tools) -->
    <!-- Tool 1: TreeBundle -->
    <g transform="translate(240, 130)">
      <rect width="42" height="42" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <path d="M14 28 L14 18 L28 18 M14 23 L25 23" stroke="#b07d4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="18" r="3" fill="#1e1a15"/>
      <circle cx="25" cy="23" r="3" fill="#1e1a15"/>
      <circle cx="14" cy="18" r="3" fill="#1e1a15"/>
      <circle cx="14" cy="28" r="3" fill="#1e1a15"/>
    </g>

    <!-- Tool 2: ClearLink-PDF -->
    <g transform="translate(295, 130)">
      <rect width="42" height="42" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <rect x="13" y="11" width="16" height="20" rx="2" fill="none" stroke="#1e1a15" stroke-width="2"/>
      <path d="M17 18 H25 M17 23 H22" stroke="#b07d4a" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Tool 3: Archive Scanner -->
    <g transform="translate(350, 130)">
      <rect width="42" height="42" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <circle cx="18" cy="18" r="6" fill="none" stroke="#b07d4a" stroke-width="2"/>
      <line x1="22" y1="22" x2="29" y2="29" stroke="#1e1a15" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Tool 4: DirectLink -->
    <g transform="translate(405, 130)">
      <rect width="42" height="42" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <path d="M14 21 C14 17, 17 14, 21 14 M28 21 C28 25, 25 28, 21 28" stroke="#1e1a15" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 18 L24 24" stroke="#b07d4a" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Tool 5: Results Search -->
    <g transform="translate(460, 130)">
      <rect width="42" height="42" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <path d="M13 14 H29 M13 20 H29 M13 26 H21" stroke="#b07d4a" stroke-width="2" stroke-linecap="round"/>
      <circle cx="26" cy="26" r="2.5" fill="#1e1a15"/>
    </g>

    <!-- Tool 6: YouTube Transcript -->
    <g transform="translate(515, 130)">
      <rect width="42" height="42" rx="8" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <rect x="11" y="14" width="20" height="14" rx="3" fill="#1e1a15"/>
      <polygon points="19,18 19,24 24,21" fill="#fffdf9"/>
      <circle cx="28" cy="14" r="3" fill="#b07d4a"/>
    </g>

    <!-- Status indicator badge -->
    <g transform="translate(365, 195)">
      <rect width="70" height="24" rx="12" fill="#faf6f0" stroke="#e8d5b7" stroke-width="1"/>
      <circle cx="375" cy="207" r="4.5" fill="#b07d4a"/>
      <text x="387" y="210" class="sans-text" font-size="8.5" font-weight="600" fill="#1e1a15" letter-spacing="0.5">LAUNCHER</text>
    </g>
  </g>

  <!-- Typography Text -->
  <g id="lower-segment">
    <text x="400" y="365" class="title-text" font-size="28" text-anchor="middle">
      My <tspan class="title-italic">Tools</tspan>
    </text>
    
    <text x="400" y="398" class="sans-text" font-size="14" font-weight="300" fill="#4a4038" text-anchor="middle" letter-spacing="0.2">
      Direct links to live web utilities, archive scrapers, and open-source packages.
    </text>
    
    <circle cx="400" cy="435" r="2" fill="#b07d4a"/>
    <line x1="360" y1="435" x2="385" y2="435" stroke="#e8d5b7" stroke-width="1"/>
    <line x1="415" y1="435" x2="440" y2="435" stroke="#e8d5b7" stroke-width="1"/>
  </g>
</svg>
